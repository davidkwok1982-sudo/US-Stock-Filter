services:
  - type: web
    name: us-stock-filter
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: KAI_LUT_TTL_HOURS
        value: "12"
      - key: KAI_LUT_CACHE
        value: /app/cache
